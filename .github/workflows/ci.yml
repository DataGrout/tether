name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    name: tether-cli (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
        working-directory: tether-cli

  lua-utils:
    name: TetherUtils (lune)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install lune
        run: cargo install lune --locked
      - name: Run TetherUtils tests
        run: lune run tether-lua/lune_tests.luau
