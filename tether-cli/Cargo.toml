[package]
name = "tether-cli"
version = "0.2.0"
edition = "2021"
description = "CLI for bootstrapping Tether in Rojo/Wally projects"
license = "MIT"

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
